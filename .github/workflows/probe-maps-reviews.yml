
name: Probe free Google Maps reviews

'on': [workflow_dispatch, push]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe one page of TXRH reviews without Google login
        run: node probe-maps-reviews.js
